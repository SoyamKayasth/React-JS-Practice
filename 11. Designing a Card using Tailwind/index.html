<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="flex flex-col md:flex-row text-center border rounded font-sans max-w-160 mx-4 md:mx-auto my-4"
    >
      <div class="flex
      rounded-t
      md:rounded-l
      md:rounded-r-none
      bg-linear-to-tr from-sky-400 to-indigo-600 justify-center py-5 items-center">
        <h1 class="text-white text-lg font-bold">News you can Trust.</h1>
      </div>
      <div class="py-4 flex-col flex-wrap">
        <h2 class="font-bold text-2xl">Stay up to date with the Latest!</h2>
        <p class="font-medium">
          Subscribe to our newsletter for the latest news straight into your
          inbox
        </p>

        <form class="flex-col mt-4 mb-2">
            <input
              type="email"
              name="email"
              id="email"
              placeholder="you@example.com"
              class="max-w-md text-center bg-gray-200 rounded-md py-1.5 w-xs"
            />
            <button
              type="submit"
              class="rounded-2xl bg-blue-500 py-2 w-xs text-sm text-white max-w-md mt-2 cursor-pointer"
            >
              Subscribe Now
            </button>
          
      </form>
        <small class="font-medium">We value your privacy</small>
      </div>
    </div>
  </body>
</html>
